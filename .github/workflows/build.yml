name: Обновление индекса поиска
on:
  schedule:
    - cron: "17 */6 * * *"   # каждые 6 часов
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: build-index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать индекс
        run: python scripts/build_index.py
      - name: Сохранить, если изменилось
        if: always()
        run: |
          git config user.name "shefiko-search-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "без изменений"; else git commit -m "Обновлён индекс поиска"; git push; fi
