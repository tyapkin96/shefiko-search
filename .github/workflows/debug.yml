name: Debug page capture
on: workflow_dispatch
permissions:
  contents: write
jobs:
  cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture
        run: |
          mkdir -p debug
          curl -sL --compressed https://static.tildacdn.com/js/tilda-searchwidget-1.0.min.js -o debug/widget.js || true
          curl -sL --compressed https://static.tildacdn.com/css/tilda-searchwidget-1.0.min.css -o debug/widget.css || true
          ls -la debug
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug
          git commit -m "debug capture" || exit 0
          git push
