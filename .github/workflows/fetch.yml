name: Fetch assets
on: workflow_dispatch
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p tmp_assets && cd tmp_assets
          for u in \
           https://static.tildacdn.com/tild3331-3765-4263-b334-653665643133/Group_4.svg \
           https://static.tildacdn.com/tild3734-3961-4362-b035-343938356331/Group_10.svg \
           https://static.tildacdn.com/tild3736-3033-4730-b935-353032396230/Group_2089344548.svg \
           https://static.tildacdn.com/tild6338-3264-4464-a262-323963396536/photo.webp \
           https://static.tildacdn.com/tild6365-3633-4036-b962-323064633364/__.svg https://static.tildacdn.com/tild6561-3130-4432-b261-363334376239/d.svg https://static.tildacdn.com/tild3631-6562-4164-b634-646439373432/svg_1753356021372.svg https://static.tildacdn.com/tild6666-3736-4932-b836-336238393862/burger.svg ; do
            curl -sL --compressed "$u" -o "$(basename $u)" || true
          done
          ls -la
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp_assets
          git commit -m "tmp assets" || exit 0
          git push
